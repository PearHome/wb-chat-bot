name: WB Chat Bot

on:
  # Кнопка "Run workflow" в интерфейсе GitHub — запуск вручную в любой момент
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (true = ничего не отправлять, только показать план)"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

  # Автоматический запуск по расписанию (cron, время UTC).
  # Пример ниже: каждый день в 09:00 UTC (12:00 по Москве).
  # Пока можно закомментировать/удалить, если рано настраивать расписание.
  schedule:
    - cron: "0 9 * * *"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run bot
        env:
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
          NEW_MESSAGE_TEXT: ${{ secrets.NEW_MESSAGE_TEXT }}
          # При ручном запуске берётся значение из инпута кнопки,
          # при запуске по расписанию — всегда true (безопасный дефолт)
          DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
        run: node wb_chat_bot.js
