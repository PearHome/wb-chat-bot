name: WB Chat Bot

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (true = ничего не отправлять, только показать план)"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

  schedule:
    - cron: "*/5 * * * *"

# Нужно для того, чтобы workflow мог закоммитить обновлённый state.json обратно в репозиторий
permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run bot
        env:
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
          NEW_MESSAGE_TEXT: ${{ secrets.NEW_MESSAGE_TEXT }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: node wb_chat_bot.js

      - name: Commit updated state.json
        run: |
          git config user.name "wb-chat-bot"
          git config user.email "actions@github.com"
          if [ -n "$(git status --porcelain state.json)" ]; then
            git add state.json
            git commit -m "chore: update chat events cursor [skip ci]"
            git push
          else
            echo "state.json не изменился, коммитить нечего"
          fi
